# Nginx site for the PlayerHaat API on Ubuntu.  Copy to /etc/nginx/sites-available/playerhaat-api,
# symlink into sites-enabled, then:  sudo nginx -t && sudo systemctl reload nginx
#
# Serves https://playerhaat-api.tashanto.com (change the name if the domain changes). Get the certificate first (see docs/DEPLOYMENT.md):
#   sudo certbot certonly --nginx -d playerhaat-api.tashanto.com
#
# Set TRUST_PROXY=1 in the app's .env (ecosystem.config.cjs does this in production) so the app sees
# the real client address from X-Forwarded-For.

# ── shared-memory rate limits: exact across all PM2 workers (the in-app limiters are per worker) ──
# Per client IP. Mobile carriers put many phones behind one IP, so these are deliberately roomy:
# they exist to stop floods and credential stuffing, not to meter normal use (the app does that per user).
limit_req_zone $binary_remote_addr zone=ph_api:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=ph_auth:10m rate=60r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=ph_conn:10m;

upstream playerhaat_api {
    server 127.0.0.1:4000;
    keepalive 32;               # reuse upstream connections (Node's keepAliveTimeout is 65s, longer than Nginx's idle timeout)
}

server {
    listen 80;
    listen [::]:80;
    server_name playerhaat-api.tashanto.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name playerhaat-api.tashanto.com;

    ssl_certificate     /etc/letsencrypt/live/playerhaat-api.tashanto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playerhaat-api.tashanto.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ph_ssl:10m;
    ssl_session_tickets off;

    # The app (helmet) sets the rest of the security headers; these two belong at the edge.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    # Photos are capped at 5 MB by the app; leave room for multipart overhead.
    client_max_body_size 6m;
    client_body_timeout 60s;
    client_header_timeout 15s;
    send_timeout 60s;
    limit_conn ph_conn 40;

    # Standard reverse-proxy headers. X-Request-Id lets one id follow a request from Nginx logs into the app's.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503;   # retry a restarting worker (idempotent GETs only)
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;

    # Credential endpoints: tight, and never retried against another worker.
    location ^~ /api/v1/auth/ {
        limit_req zone=ph_auth burst=30 nodelay;
        proxy_next_upstream off;
        proxy_pass http://playerhaat_api;
    }

    # Uploads: allow slow phones time to send the body; don't retry a half-sent upload.
    location = /api/v1/media/images { limit_req zone=ph_api burst=20 nodelay; client_body_timeout 120s; proxy_request_buffering on; proxy_next_upstream off; proxy_pass http://playerhaat_api; }
    location ~ ^/api/v1/(users/me/avatar|players/me/media/photos)$ { limit_req zone=ph_api burst=20 nodelay; client_body_timeout 120s; proxy_next_upstream off; proxy_pass http://playerhaat_api; }

    location /api/ {
        limit_req zone=ph_api burst=60 nodelay;
        proxy_pass http://playerhaat_api;
    }

    # Liveness for uptime monitors; not rate limited, not logged.
    location = /health { access_log off; proxy_pass http://playerhaat_api; }
    # Readiness hits the database: keep it internal (load balancer / monitoring on the box only).
    location = /health/ready { allow 127.0.0.1; allow ::1; deny all; proxy_pass http://playerhaat_api; }

    # Swagger is off in production (DOCS_ENABLED). If you turn it on, restrict it:
    # location ~ ^/(docs|openapi\.json) { allow YOUR.OFFICE.IP; deny all; proxy_pass http://playerhaat_api; }

    # Android App Links / iOS Universal Links verification files for the https://…/p/{id} and /r/{id} deep links.
    # (If the marketing website lives on another host, serve these there instead.)
    location /.well-known/ {
        root /var/www/playerhaat;
        default_type application/json;
        try_files $uri =404;
    }

    location / { return 404; }
}
